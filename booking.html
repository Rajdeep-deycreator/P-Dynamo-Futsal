<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TURFX Siliguri</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="fourm">
    <input type="text" placeholder="Your Name" id="name">
    <input type="tel" placeholder="Phone Number" id="ph">
    <input type="email" placeholder="Your Email" id="email">
    <input type="date" id="Date">
    <div id="timeSlots">
      <label>
      <input type="radio" name="slots" id="6am-7am">6:00 Am - 7:00 Am
      </label>
      <label>
      <input type="radio" name="slots" id="7am-8am">7:00 Am - 8:00 Am
      </label>
      
    </div>
    <button type="submit" onclick="book()">Verify and book now</button>
  </div>
</body>
<script src="/turf/dates.js"></script>
<script src="/js/booking.js"></script>
</html>
