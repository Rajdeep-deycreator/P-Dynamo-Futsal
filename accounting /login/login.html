<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | P Dynamo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand">P.Dynamo</a>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline">Login</a>
            <a href="signup.html" class="btn btn-lime">Sign Up</a>
            <a href="index.html#slots" class="btn btn-lime">Book Now</a>
        </div>
    </header>

    <section class="auth-page">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <!-- TODO (backend): set action to your endpoint -->
            <form id="login-form" action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="loginEmail" name="email" required>
                <label for="password">Password</label>
                <input type="password" id="loginPassword" name="password" required>
                <p class="form-error" id="form-error"></p>
                <input type="button" class="btn btn-lime" onclick="loginbtn()" value="Login"></input>
            </form>
            <p class="auth-switch">New here? <a href="/accounting /signup/signup.js">Create an account</a></p>
        </div>
    </section>

    <footer>
        &copy; 2026 P Dynamo Futsal Indoor Turf. All rights reserved.
    </footer>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
  <script src="/firebase.js"></script>
  <script src="js/main.js"></script>
  <script src="/accounting /login/login.js"></script>
</body>
</html>
