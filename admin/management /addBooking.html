<!DOCTYPE html>

<body>
  <div class="card">
    <h1>P Dynamo Futsal</h1>

    <form id="form">
      <label>Name</label>
      <input type="text" id="name" placeholder="Enter name" required>

      <label>Phone Number</label>

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter email" required>

      <label>Booking Date</label>
      <input type="date" id="date" required>
   
     
<label>Time Slots</label>
<div class="slots" id="slots">

  <button type="button" class="slot" id="11:00 AM">11:00 AM</button>
  <button type="button" class="slot" id="12:00 PM">12:00 PM</button>
  <button type="button" class="slot" id="01:00 PM">01:00 PM</button>
  <button type="button" class="slot" id="02:00 PM">02:00 PM</button>
  <button type="button" class="slot" id="03:00 PM">03:00 PM</button>

  <button type="button" class="slot" id="09:00 PM">09:00 PM</button>
  <button type="button" class="slot" id="10:00 PM">10:00 PM</button>

</div>


      <input type="button" onclick="book()" class="submit" value="Book Now"></input>
      <div id="subtotal">
        
      </div>
    </form>

  </div>
