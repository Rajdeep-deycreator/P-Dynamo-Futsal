<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal - Admin Dashboard</title>
    <link rel="stylesheet" href="/admin/dashboard /dashboard.css">
</head>
<body>
    <nav class="k2-navbar">
        <div id="k2-nav-left"class="k2-nav-left">
            <h2>Futsal<span>ADMIN</span></h2>
        </div>
        <div class="k2-nav-right">
            
        </div>
    </nav>
    <section id="allUsers">
    <div class="k2-dashboard-body">
        <div class="section-header">
            <h3>Marathon Application</h3>
            <select name="filter" id="filter">
                <option value="all">All</option>
                <option value="waiting">Waiting</option>
                <option value="approved">Approved</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table class="k2-table" id="data">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>T shirt Size</th>
                        <th>Address</th>
                        <th>Gender</th>
                        <th>Status</th>
                        <th>action</th>
                        
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="5" style="text-align:center; color:#666;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </section>
    

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
<script src="/firebase.js"></script>
<script src="/admin/login/logi.js"></script>
<script src="/admin/marathon/marathon.js"></script>
</body>
</html>
